# main に送るたびに、自動でビルドして GitHub Pages に公開する
name: 公開

on:
  push:
    branches: [main]
  workflow_dispatch: # GitHubの画面から手動でも動かせるようにする

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。連続で送っても最後のものが残る
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: ライブラリの取得
        run: npm ci
        working-directory: app

      - name: テスト
        run: npm run test
        working-directory: app

      - name: ビルド
        run: npm run build
        working-directory: app

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
